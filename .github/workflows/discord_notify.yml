name: Custom Discord Notification
on: [push] # Triggers on every push

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Custom Embed
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "username": "Repo Sentinel",
            "embeds": [{
              "title": "New Code Pushed!",
              "description": "A new commit has been uploaded to the repository.",
              "color": 9581567, 
              "fields": [
                { "name": "Commit Message", "value": "${{ github.event.head_commit.message }}", "inline": false },
                { "name": "Author", "value": "${{ github.actor }}", "inline": true },
                { "name": "Repository", "value": "${{ github.repository }}", "inline": true }
              ],
              "footer": { "text": "GitHub Actions Notifier" },
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }]
          }' ${{ secrets.DISCORD_WEBHOOK }}